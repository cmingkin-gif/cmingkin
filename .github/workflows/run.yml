name: Football Auto Scraper

on:
  schedule:
    - cron: '*/15 * * * *'  # 每 15 分鐘自動執行一次
  workflow_dispatch:        # 允許你在 GitHub Actions 頁面手動撳掣測試

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write       # 允許腳本更新 recorded_state.json 以防止重複發送通知

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 selenium urllib3

    - name: Run scraper script
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 👈 最關鍵呢行：將鎖匙交畀 Python
      run: python app.py

    - name: Commit and push state file
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add recorded_state.json || echo "No state file to add"
        git commit -m "Auto-update recorded state" || echo "No changes to commit"
        git push || echo "No push needed"
