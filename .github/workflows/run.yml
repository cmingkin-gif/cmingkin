name: Football Auto Scraper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      models: read          # 👈 開啟 GitHub 官方免費 AI 模型權限 (極重要)

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 selenium urllib3

    - name: Run scraper script
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 👈 將 GitHub 內置鎖匙交畀 Python (極重要)
      run: python app.py

    - name: Commit and push state file
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add recorded_state.json || echo "No state file to add"
        git commit -m "Auto-update recorded state" || echo "No changes to commit"
        git push || echo "No push needed"
