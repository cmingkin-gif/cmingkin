name: Pinna Scraper Auto Run

on:
  schedule:
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper
      run: python app.py

    - name: Commit state file back to repo
     run: |
       git config --local user.email "action@github.com"
       git config --local user.name "GitHub Action"
       git add recorded_state.json
       git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update match state" && git pull --rebase origin main && git push)
