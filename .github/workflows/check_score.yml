name: Check Finished Match Scores

on:
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = 香港時間早上 6:00
  workflow_dispatch:      # 容許手動隨時撳掣測試

jobs:
  run-score-checker:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 selenium urllib3

    - name: Run check_score script
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: python check_score.py

    - name: Commit and push updated state
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add recorded_state.json || echo "No state file to add"
        git commit -m "Auto-update settled match scores" || echo "No changes to commit"
        git push || echo "No push needed"
